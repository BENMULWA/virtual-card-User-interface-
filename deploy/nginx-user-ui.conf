# Include INSIDE the existing `server { listen 443 ssl; server_name payments.mamlakapsp.com; ... }` block.
#
#   sudo cp nginx-user-ui.conf /etc/nginx/snippets/mamlaka-user-ui.conf
#   (add the line  include snippets/mamlaka-user-ui.conf;  inside the server block)
#   sudo nginx -t && sudo systemctl reload nginx
#
# Two things are served from this host:
#   /            -> the built React app (static files from dist/)
#   /api/        -> the FastAPI backend on 127.0.0.1:8000
#
# Serving both from one origin means the browser never makes a cross-origin
# request, so CORS is not needed in production.

# =========================================================
# API
# =========================================================
location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, never append
    proxy_set_header X-Forwarded-Proto $scheme;

    # Server-Sent Events: the journey stream must not be buffered.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # KYC uploads are capped at 2 MB by the app; allow headroom.
    client_max_body_size 3m;
}

# =========================================================
# THE USER UI (static React build)
# =========================================================
# Build it with:  cd user-ui-application && npm run build
# Then copy dist/ to the server, e.g. /var/www/mamlaka-user-ui

root /var/www/mamlaka-user-ui;
index index.html;

location / {
    # SPA fallback: every route is served by index.html and routed client-side.
    try_files $uri $uri/ /index.html;
}

# Hashed build assets are immutable - cache them hard.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# index.html must never be cached, or clients keep loading an old bundle.
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires 0;
}
